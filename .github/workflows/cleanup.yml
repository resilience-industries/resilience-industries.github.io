name: Universal Cleanup Everywhere

on:
  push:
  workflow_dispatch:

jobs:
  deep-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Purge Limited Across Code, Content, URLs, and Scripts
        run: |
          # 1. Purge "-limited" from all URLs (LinkedIn, Web addresses, canonical links)
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.xml" -o -name "*.md" \) \
            -not -path "*/.git/*" \
            -exec sed -i 's|https://www.linkedin.com/company/resilience-industries-limited|https://www.linkedin.com/company/resilience-industries|g' {} +
          
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.xml" -o -name "*.md" \) \
            -not -path "*/.git/*" \
            -exec sed -i 's|resilience-industries-limited|resilience-industries|g' {} +

          # 2. Purge exact phrase "Resilience Industries Limited" across all code & visible text
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.xml" -o -name "*.md" \) \
            -not -path "*/.git/*" \
            -exec sed -i 's/Resilience Industries Limited/Resilience Industries/g' {} +

          # 3. Clean schema.json alternateName array
          find . -type f \( -name "*.html" -o -name "*.json" \) \
            -not -path "*/.git/*" \
            -exec sed -i 's/"Resilience Industries Limited", //g' {} +
          find . -type f \( -name "*.html" -o -name "*.json" \) \
            -not -path "*/.git/*" \
            -exec sed -i 's/, "Resilience Industries Limited"//g' {} +

          # 4. Clean JS Voice Announcements & Strings (ensure pure brand name)
          find . -type f -name "*.js" \
            -not -path "*/.git/*" \
            -exec sed -i 's/welcome to Resilience Industries Limited/welcome to Resilience Industries/gI' {} +

      - name: Commit and Push Clean Repository
        run: |
          git config user.name "Auto Cleanup Bot"
          git config user.email "bot@resilience-industries.github.io"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Universal deep-clean: remove Limited & -limited from all files, URLs, and voice scripts" && git push)
