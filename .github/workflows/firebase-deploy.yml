name: Deploy Resilience Industries to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_to_hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RESILIENCE_INDUSTRIES }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Hosting Site and Deploy
        run: |
          npm install -g firebase-tools
          npx firebase-tools hosting:sites:create resilience-industries --project resilience-industries --non-interactive || true
          npx firebase-tools deploy --only hosting --project resilience-industries --non-interactive
